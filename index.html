<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:#3ecf8e;color:#08130d;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#1a1d23;border:1px solid #2c313a;border-bottom-left-radius:4px}
.cites{align-self:flex-start;font-size:12px;color:#9aa3ad;margin-top:-4px;padding:0 6px}
.composer{display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
textarea{flex:1;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:14px;padding:11px 14px;font:inherit;resize:none;min-height:46px;max-height:120px}
button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
button.secondary{background:#2c313a;color:#e6e6e6;font-size:13px;padding:6px 12px;border-radius:8px}
button:disabled{opacity:.5}
input,select{width:100%;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:10px;padding:12px;font:inherit}
.auth{padding:16px 14px}
.auth button{padding:12px 18px;margin-top:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.muted{color:#9aa3ad;font-size:14px}
.err{color:#ff7b72;font-size:14px;padding:0 14px}
.typing{align-self:flex-start;color:#9aa3ad;font-size:14px;padding:0 6px}
#tasks,#goals{flex:1;overflow-y:auto;padding:8px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid #2c313a}
.dot{width:8px;height:8px;border-radius:50%}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.segbar{display:flex;gap:2px;margin:4px 0}
.seg{flex:1;height:8px;border-radius:2px;background:#2c313a}
.seg.on{background:#3ecf8e}
.meter{height:8px;border-radius:4px;background:#2c313a;overflow:hidden;margin:4px 0}
.card{background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin:10px 0}
.meter>div{height:100%;border-radius:4px}
.small{font-size:12px;color:#9aa3ad;margin:2px 0}
.task-full{white-space:pre-wrap;background:#12151a;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;max-height:320px;overflow-y:auto;font-size:14px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.filterbtn{flex:none;background:#1a1d23;color:#9aa3ad;border:1px solid #2c313a;border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.filterbtn.active{background:#e6e6e6;color:#0f1115;border-color:#e6e6e6}
.summary{display:flex;gap:14px;flex-wrap:wrap;padding:2px 2px 10px;color:#9aa3ad;font-size:12px}
.summary b{color:#e6e6e6}
.goal-desc{white-space:pre-wrap;background:#0f1115;border:1px solid #2c313a;border-radius:8px;padding:10px;margin-top:8px;font-size:13.5px;color:#c7ccd3}
.addform{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.addform .row2{display:flex;gap:8px}
.addform .row2>*{flex:1}
.newgoalbtn{width:100%;text-align:left;background:#1a1d23;color:#9aa3ad;border:1px dashed #2c313a}
.goal-path{display:flex;flex-direction:column}
.goal-row{display:flex;gap:10px}
.goal-connector{display:flex;flex-direction:column;align-items:center;width:18px;flex:none}
.goal-node-dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:14px;box-shadow:0 0 0 3px #0f1115,0 0 0 4.5px currentColor}
.goal-node-line{width:2px;flex:1;min-height:22px;background:#2c313a;margin:4px 0}
.goal-box{flex:1;min-width:0;background:#12151a;border:1px solid #2c313a;border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.goal-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.goal-obj-count{font-size:12px;color:#9aa3ad}
.goal-checklist{margin-top:10px;padding-top:10px;border-top:1px solid #2c313a;display:flex;flex-direction:column;gap:2px}
.goal-obj{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.goal-obj input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:#3ecf8e;cursor:pointer}
.goal-obj span{font-size:14px}
.goal-obj.done span{text-decoration:line-through;color:#9aa3ad}
.goal-generate-btn{margin-top:10px;width:100%}
.menu-wrap{position:relative}
.menu-btn{width:46px;height:46px;background:#1a1d23;color:#e6e6e6;border:1px solid #2c313a;border-radius:12px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-btn:active{background:#2c313a}
.menu-btn[aria-expanded="true"]{background:#2c313a;border-color:#3ecf8e}
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:208px;background:#1a1d23;border:1px solid #2c313a;border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.45);z-index:30}
.menu-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9aa3ad;padding:10px 12px 6px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:transparent;color:#e6e6e6;border:0;border-radius:10px;padding:12px 12px;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu-item:active{background:#2c313a}
.menu-item.active{background:#3ecf8e;color:#08130d;font-weight:700}
.menu-item.danger{color:#ff7b72}
.menu-sep{height:1px;background:#2c313a;margin:6px 6px}
</style></head><body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import React from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
const h = React.createElement;
const SB_URL = "https://sphnmcjlxxzgovisgepo.supabase.co";
const supabase = createClient(SB_URL, "sb_publishable_vVfIttSbf_XLWKl2xahBWA_-sXU34L0");
const HISTORY_KEY = "alleah_chat_v1";
const GOALS_KEY = "alleah_goals_v1";

// ===== Header menu =====
// Single source of truth for the view links shown in the header menu.
// To add a new tab later, just append {key, label} here - the menu and
// the active-view highlight both key off this list automatically.
const VIEWS = [
  {key:'chat', label:'Chat'},
  {key:'tasks', label:'Tasks'},
  {key:'goals', label:'Goals'},
];

function HeaderMenu(props) {
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    function onDocDown(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    function onKeyDown(e) { if (e.key === 'Escape') setOpen(false); }
    document.addEventListener('mousedown', onDocDown);
    document.addEventListener('keydown', onKeyDown);
    return () => {
      document.removeEventListener('mousedown', onDocDown);
      document.removeEventListener('keydown', onKeyDown);
    };
  }, [open]);
  return h('div', {className:'menu-wrap', ref:wrapRef},
    h('button', {
      type:'button', className:'menu-btn', 'aria-haspopup':'menu', 'aria-expanded':open,
      'aria-label': open ? 'Close menu' : 'Open menu',
      onClick:() => setOpen(o => !o),
    }, '☰'),
    open ? h('div', {className:'menu-dropdown', role:'menu'},
      h('div', {className:'menu-label'}, 'View'),
      VIEWS.map(v => h('button', {
        key:v.key, type:'button', role:'menuitem',
        className:'menu-item' + (props.view === v.key ? ' active' : ''),
        'aria-current': props.view === v.key ? 'page' : undefined,
        onClick:() => { props.setView(v.key); setOpen(false); },
      }, v.label)),
      h('div', {className:'menu-sep'}),
      h('button', {
        type:'button', role:'menuitem', className:'menu-item',
        onClick:() => { setOpen(false); props.onNewChat(); },
      }, 'New chat'),
      h('button', {
        type:'button', role:'menuitem', className:'menu-item danger',
        onClick:() => { setOpen(false); props.onSignOut(); },
      }, 'Sign out')
    ) : null);
}

function Auth() {
  const [email, setEmail] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  async function go(mode) {
    setBusy(true); setMsg('');
    const res = mode === 'up'
      ? await supabase.auth.signUp({email, password: pw})
      : await supabase.auth.signInWithPassword({email, password: pw});
    setBusy(false);
    if (res.error) setMsg(res.error.message);
    else if (mode === 'up' && !res.data.session) setMsg('Check your email to confirm, then sign in.');
  }
  return h('div', {className:'auth'},
    h('h1', null, 'Alleah'),
    h('div', {style:{height:'12px'}}),
    h('input', {placeholder:'email', type:'email', value:email, onChange:e=>setEmail(e.target.value)}),
    h('div', {style:{height:'8px'}}),
    h('input', {placeholder:'password', type:'password', value:pw, onChange:e=>setPw(e.target.value)}),
    h('div', {className:'row'},
      h('button', {disabled:busy, onClick:()=>go('in')}, 'Sign in'),
      h('button', {className:'secondary', disabled:busy, onClick:()=>go('up')}, 'Sign up')),
    msg ? h('p', {className:'muted'}, msg) : null);
}

function Chat(props) {
  const [messages, setMessages] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  });
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [view, setView] = React.useState('chat');
  const endRef = React.useRef(null);
  React.useEffect(() => {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-60)));
    endRef.current && endRef.current.scrollIntoView({behavior:'smooth'});
  }, [messages, busy]);

  async function send() {
    const content = text.trim();
    if (!content || busy) return;
    setErr(''); setText('');
    const next = [...messages, {role:'user', content}];
    setMessages(next); setBusy(true);
    try {
      const res = await fetch(SB_URL + '/functions/v1/ask', {
        method:'POST',
        headers:{'content-type':'application/json','authorization':'Bearer ' + props.session.access_token},
        body: JSON.stringify({messages: next.slice(-10).map(m => ({role: m.role, content: m.content}))})
      });
      const out = await res.json();
      if (out.error) setErr('Error: ' + out.error);
      else setMessages(m => [...m, {role:'assistant', content: out.answer, folders: out.folders || []}]);
    } catch (e) { setErr('Error: ' + e); }
    setBusy(false);
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return h(React.Fragment, null,
    h('header', null,
      h('h1', null, 'Alleah'),
      h(HeaderMenu, {
        view, setView,
        onNewChat: () => { if (confirm('Clear this conversation? (Your memory folders are not affected.)')) setMessages([]); },
        onSignOut: () => supabase.auth.signOut(),
      })),
    view === 'tasks' ? h(Tasks, {session: props.session})
    : view === 'goals' ? h(Goals, null)
    : h(React.Fragment, null,
    h('div', {id:'thread'},
      messages.length === 0 ? h('p', {className:'muted', style:{padding:'0 6px'}}, 'Talk to me. What you tell me about what you know gets remembered - automatically.') : null,
      messages.map((m, i) =>
        h(React.Fragment, {key:i},
        h('div', {className:'msg ' + m.role}, m.content),
        m.folders && m.folders.length
          ? h('div', {className:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  '))
          : null)),
      busy ? h('div', {className:'typing'}, 'thinking...') : null,
      h('div', {ref:endRef})),
    err ? h('p', {className:'err'}, err) : null,
    h('div', {className:'composer'},
      h('textarea', {placeholder:'Message Alleah...', value:text, rows:1, onChange:e=>setText(e.target.value), onKeyDown:onKey}),
      h('button', {disabled:busy || !text.trim(), onClick:send}, 'Send'))));
}

// ===== Task tray =====
// Three meters visualize BUDGET CONSUMED (steps / spend / time) - deliberately no
// percent-complete bar anywhere: completion isn't knowable.
const STATUS_COLOR = {queued:'#9aa3ad', running:'#3ecf8e', done:'#3ecf8e', capped:'#e0a458', failed:'#ff7b72', cancelled:'#5c636e'};

function fmtAge(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

function TaskCard(props) {
  const t = props.t;
  const [open, setOpen] = React.useState(false);
  const active = t.status === 'queued' || t.status === 'running';
  // Kind-aware budget caps: build/revision run on the larger build budget.
  const CAP = (t.kind === 'build' || t.kind === 'revision')
    ? {steps: 50, spend: 2.00, min: 30}
    : {steps: 25, spend: 0.50, min: 15};
  const steps = Math.min(t.steps_used || 0, CAP.steps);
  const spend = Math.min(Number(t.spend_usd) || 0, CAP.spend);
  const spendRatio = spend / CAP.spend;
  const endMs = t.completed_at ? new Date(t.completed_at).getTime() : Date.now();
  const elapsedMs = Math.max(0, Math.min(endMs - new Date(t.created_at).getTime(), CAP.min*60000));
  const elapsed = Math.floor(elapsedMs/60000) + 'm ' + Math.floor((elapsedMs%60000)/1000) + 's';
  const spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
  const color = STATUS_COLOR[t.status] || '#9aa3ad';
  const pv = props.preview;
  const rvw = props.review;
  const sha = rvw ? (/audited staged commit: ([0-9a-f]{7,40})/i.exec(rvw) || [])[1] : null;
  // Clean verdict needs POSITIVE evidence: an audited SHA plus an explicit no-findings
  // marker, and no findings SECTION. A findings section is an anchored "Findings:" line
  // not immediately saying none/0 - so "no findings in the CSS" elsewhere can't cancel
  // a real findings list. Ambiguity defaults to "ask Alleah" - never green.
  const saysClean = rvw ? /\bno findings\b|\b0 findings\b|\bverdict:\s*clean\b|\bfindings:\s*(none|0)\b/i.test(rvw) : false;
  const hasFindings = rvw ? /^\s*findings\s*:(?!\s*(none|0)\b)/mi.test(rvw) : false;
  const clean = !!sha && saysClean && !hasFindings;
  const safeUrl = pv && typeof pv.preview_url === 'string' && /^https:\/\//.test(pv.preview_url);
  return h('div', {className:'card'},
    h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px'}},
      h('span', {className:'badge'},
        h('span', {className:'dot' + (t.status==='running'?' pulse':''), style:{background:color}}),
        h('span', {style:{color:color}}, (t.kind && t.kind !== 'research' ? t.kind + ' · ' : '') + t.status)),
      h('span', {className:'small'}, fmtAge(t.created_at)),
      active ? h('button', {className:'secondary', style:{marginTop:0,padding:'4px 10px',fontSize:'12px'},
        onClick:function(){ if(confirm('Cancel this task?')) props.onCancel(t.id); }}, 'Cancel') : null),
    pv && !(pv.status === 'expired' && !safeUrl) ? h('p', {className:'small', style:{margin:'6px 0 0'}},
      safeUrl ? h('a', {href: pv.preview_url, target:'_blank', rel:'noopener', style:{color:'#3ecf8e'}}, 'Preview ↗')
              : h('span', {style:{color:'#9aa3ad'}}, pv.status === 'building' ? 'preview building…' : 'preview url missing'),
      '  rev ' + pv.revision + ' · ' + pv.status,
      rvw ? (clean
        ? h('span', null, '  ·  review: clean ✓  ',
            h('a', {href:'https://github.com/maxrym-svg/alleah/actions/workflows/promote-preview.yml', target:'_blank', rel:'noopener', style:{color:'#3ecf8e'}}, 'Promote ↗'),
            '  sha ' + sha.slice(0,12) + '…')
        : hasFindings
          ? h('span', {style:{color:'#e0a458'}}, '  ·  review: findings - ask Alleah')
          : h('span', {style:{color:'#9aa3ad'}}, '  ·  review done - ask Alleah for the verdict')) : null) : null,
    h('p', {style:{margin:'8px 0 4px',cursor:'pointer'}, onClick:function(){setOpen(!open)}},
      (function(){
        const label = t.kind === 'review'
          ? 'audit of build ' + (t.instruction || '').trim().slice(0, 8)
          : (t.instruction || '');
        return open ? label : (label.length > 110 ? label.slice(0,110) + '...' : label);
      })()),
    t.status === 'running' && t.progress ? h('p', {className:'small', style:{color:'#e6e6e6'}}, '▸ ' + t.progress) : null,
    active ? h('div', null,
      h('div', {className:'small'}, 'steps used: ' + steps + ' / ' + CAP.steps),
      h('div', {className:'segbar'}, Array.from({length: CAP.steps}, function(_, i){
        return h('span', {key:i, className:'seg' + (i < steps ? ' on' : '')}); })),
      h('div', {className:'small'}, 'spend: $' + spend.toFixed(2) + ' / $' + CAP.spend.toFixed(2) + ' cap'),
      h('div', {className:'meter'}, h('div', {style:{width:(spendRatio*100)+'%',background:spendColor}})),
      h('div', {className:'small'}, 'time since queued: ' + elapsed + ' / ' + CAP.min + 'm limit (worker may start up to 1m after queuing)'),
      h('div', {className:'meter'}, h('div', {style:{width:(elapsedMs/(CAP.min*60000)*100)+'%',background:'#3ecf8e'}}))) : null,
    open ? h('div', null,
      t.result ? h('div', {className:'task-full'}, t.result) : null,
      t.error ? h('p', {className:'err', style:{padding:0}}, t.error) : null,
      h('p', {className:'small'}, 'steps ' + (t.steps_used ?? 0) + ' · $' + (Number(t.spend_usd)||0).toFixed(2) +
        ' · queued ' + new Date(t.created_at).toLocaleString() +
        (t.completed_at ? ' · finished ' + new Date(t.completed_at).toLocaleString() : ''))) : null);
}

function Tasks(props) {
  const [tasks, setTasks] = React.useState([]);
  const [previews, setPreviews] = React.useState({});
  const [reviews, setReviews] = React.useState({});
  const [msg, setMsg] = React.useState('loading...');
  async function load() {
    const r = await supabase.from('worker_tasks').select('*').order('created_at', {ascending:false}).limit(50);
    if (r.error) { setMsg('Error: ' + r.error.message); return; }
    setTasks(r.data);
    setMsg(r.data.length ? '' : 'No tasks yet. Say "Alleah, start a task" in chat.');
    // latest done review per build task (review instruction = build task id)
    const rv = {};
    r.data.filter(function(t){ return t.kind === 'review' && t.status === 'done' && t.result; })
      .forEach(function(t){ const key = (t.instruction || '').trim(); if (!rv[key]) rv[key] = t.result; });
    setReviews(rv);
    const p = await supabase.from('preview_tasks').select('task_id,status,revision,preview_url');
    if (!p.error) {
      const map = {};
      p.data.forEach(function(x){ map[x.task_id] = x; });
      setPreviews(map);
    }
  }
  React.useEffect(function(){
    load(); // initial load always runs; only the polls are visibility-gated
    const iv = setInterval(function(){ if (document.visibilityState === 'visible') load(); }, 5000);
    return function(){ clearInterval(iv); };
  }, []);
  async function cancel(id) {
    // Guarded: can never clobber a terminal status that landed after render
    await supabase.from('worker_tasks').update({status:'cancelled'}).eq('id', id).in('status', ['queued','running']);
    load();
  }
  return h('div', {id:'tasks'},
    msg ? h('p', {className:'muted'}, msg) : null,
    tasks.map(function(t){ return h(TaskCard, {key:t.id, t:t, onCancel:cancel, preview:previews[t.id], review:reviews[String(t.id)]}); }));
}

// ===== Goals tab =====
// Goals render as boxes connected by a dot-and-line path (a simple roadmap), and each
// box expands to a checklist of mini-objectives rather than a percent-complete meter.
// Data layer note: no `goals` table, no migrations, no supabase.from() calls here.
// Goals are persisted client-side to localStorage (key alleah_goals_v1) using the
// same load-on-init / write-on-change pattern as the chat history (HISTORY_KEY /
// alleah_chat_v1) above. The view starts EMPTY for every user - there are no demo
// fixtures - and shows a friendly empty state until the user adds their first goal
// via the inline "+ New goal" form. When a real goals table + RPCs are designed,
// swap the localStorage load/save below for supabase.from('goals') calls following
// the same RLS-policy pattern as folders/queries/worker_tasks.
const DIFFICULTY = {
  easy:   {label: 'Easy',   color: '#3ecf8e'},
  medium: {label: 'Medium', color: '#58a6ff'},
  hard:   {label: 'Hard',   color: '#e0a458'},
  epic:   {label: 'Epic',   color: '#d68fff'},
};
const GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
const GOALS_DAY = 86400000;

function loadGoals() {
  try {
    const raw = JSON.parse(localStorage.getItem(GOALS_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}

// Fix (due-date bug): <input type="date"> hands back a plain "YYYY-MM-DD" string.
// That string must be parsed into a real calendar date, not coerced through Number()/
// parseInt() or otherwise treated as a raw epoch value - either of those reads only
// the leading digits (e.g. "2025" from "2025-06-15") and produces a millisecond
// timestamp of just a few seconds after the Unix epoch, i.e. a due date that stores
// and displays as 20000+ days in the past. Parse the y/m/d components explicitly and
// build a real local-midnight Date from them so the stored target_date always matches
// what the user picked.
function parseDateInputToMs(dateStr) {
  if (!dateStr) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr);
  if (!m) return null;
  const year = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
  return new Date(year, month - 1, day).getTime();
}

function fmtRelDay(ms) {
  const now = Date.now();
  const days = Math.round((ms - now) / GOALS_DAY);
  if (days === 0) return 'today';
  if (days > 0) return 'in ' + days + 'd';
  return Math.abs(days) + 'd ago';
}
function fmtAgeShort(ms) {
  const days = Math.round((Date.now() - ms) / GOALS_DAY);
  if (days < 1) return 'today';
  if (days < 30) return days + 'd ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}

// ===== Mini-objective generation (LOCAL ONLY - no network) =====
// generateObjectives() used to call out to a live endpoint to synthesize
// mini-objectives for a goal. That network call has been removed entirely:
// there is no fetch(), axios, XMLHttpRequest, WebSocket, or any other API
// client call anywhere in this function or anything it invokes. Instead it
// picks 3-5 objectives from a small fixed local pool (deduping against any
// objectives the goal already has) and returns them synchronously. The
// artificial delay lives only in the caller (see GoalBox's handleGenerate),
// via a plain setTimeout, purely to preserve the existing loading-state UX.
const OBJECTIVE_POOL = [
  'Research neighborhoods',
  'Calculate budget',
  'Schedule viewings',
  'Compare financing options',
  'Draft a checklist',
  'Set a target date',
  'List must-haves',
  'Review progress with a friend',
];

function generateObjectives(existingTexts) {
  const have = new Set(existingTexts || []);
  const pool = OBJECTIVE_POOL.filter(t => !have.has(t));
  const count = Math.min(pool.length, 3 + Math.floor(Math.random() * 3)); // 3-5
  const picked = [];
  const src = pool.slice();
  while (picked.length < count && src.length) {
    const idx = Math.floor(Math.random() * src.length);
    picked.push(src.splice(idx, 1)[0]);
  }
  return picked;
}

function GoalBox(props) {
  const g = props.g;
  const [open, setOpen] = React.useState(false);
  const [generating, setGenerating] = React.useState(false);
  const diff = DIFFICULTY[g.difficulty];
  const color = GOAL_STATUS_COLOR[g.status];
  const overdue = g.status === 'active' && g.target_date != null && g.target_date < Date.now();
  const total = g.objectives.length;
  const done = g.objectives.filter(o => o.done).length;
  const ratio = total ? done / total : 0;
  const meterColor = overdue ? '#ff7b72' : color;
  let dateLine;
  if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
  else if (g.status === 'active') dateLine = (overdue ? 'was due ' : 'due ') + fmtRelDay(g.target_date);
  else dateLine = 'target ' + fmtRelDay(g.target_date);

  function handleGenerate(e) {
    e.stopPropagation();
    if (generating) return;
    setGenerating(true);
    // Fake latency only, to preserve the loading-state UX. generateObjectives()
    // itself is a pure local function - nothing here ever hits the network.
    setTimeout(() => {
      const picked = generateObjectives(g.objectives.map(o => o.text));
      props.onGenerate(g.id, picked);
      setGenerating(false);
    }, 700);
  }

  return h('div', {className:'goal-box', onClick:()=>setOpen(!open)},
    h('div', {className:'goal-box-head'},
      h('p', {style:{fontSize:'15px',fontWeight:700,margin:'0 0 2px'}}, g.title),
      h('span', {className:'pill', style:{background:diff.color+'22', color:diff.color, border:'1px solid '+diff.color+'55'}}, diff.label)),
    h('div', {style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}},
      h('span', {className:'badge'},
        h('span', {className:'dot' + (g.status==='active'?' pulse':''), style:{background:color}}),
        h('span', {style:{color:color}}, g.status)),
      h('span', {className:'small'}, g.category),
      g.target_date != null ? h('span', {className:'small'}, '·') : null,
      g.target_date != null ? h('span', {className:'small', style:{color: overdue ? '#ff7b72' : '#9aa3ad'}}, dateLine) : null),
    h('div', {className:'meter'}, h('div', {style:{width:(ratio*100)+'%', background:meterColor}})),
    h('div', {className:'goal-obj-count'}, done + ' / ' + total + ' mini-objectives'),
    open ? h('div', null,
      h('div', {className:'goal-desc'}, g.description),
      h('div', {className:'goal-checklist'},
        g.objectives.map(o => h('label', {
            key:o.id, className:'goal-obj' + (o.done ? ' done' : ''),
            onClick:(e)=>e.stopPropagation(),
          },
          h('input', {type:'checkbox', checked:o.done, onChange:()=>props.onToggle(g.id, o.id)}),
          h('span', null, o.text)))),
      h('button', {
        type:'button', className:'secondary goal-generate-btn', disabled:generating, onClick:handleGenerate,
      }, generating ? 'Generating…' : '+ Generate mini-objectives')) : null);
}

function NewGoalForm(props) {
  const [title, setTitle] = React.useState('');
  const [category, setCategory] = React.useState('');
  const [difficulty, setDifficulty] = React.useState('medium');
  const [targetDate, setTargetDate] = React.useState('');
  const [description, setDescription] = React.useState('');

  function submit(e) {
    e.preventDefault();
    const t = title.trim();
    if (!t) return;
    props.onAdd({
      id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: t,
      category: category.trim() || 'General',
      difficulty,
      status: 'active',
      description: description.trim(),
      created_at: Date.now(),
      target_date: parseDateInputToMs(targetDate),
      objectives: [],
    });
  }

  return h('form', {className:'card addform', onSubmit:submit},
    h('input', {placeholder:'Goal title', value:title, autoFocus:true, onChange:e=>setTitle(e.target.value)}),
    h('div', {className:'row2'},
      h('input', {placeholder:'Category (optional)', value:category, onChange:e=>setCategory(e.target.value)}),
      h('select', {value:difficulty, onChange:e=>setDifficulty(e.target.value)},
        Object.keys(DIFFICULTY).map(k => h('option', {key:k, value:k}, DIFFICULTY[k].label)))),
    h('input', {type:'date', value:targetDate, onChange:e=>setTargetDate(e.target.value)}),
    h('textarea', {placeholder:'Description (optional)', value:description, rows:3, style:{minHeight:'70px'}, onChange:e=>setDescription(e.target.value)}),
    h('div', {className:'row'},
      h('button', {type:'submit'}, 'Add goal'),
      h('button', {type:'button', className:'secondary', onClick:props.onCancel}, 'Cancel')));
}

function Goals(props) {
  const [goals, setGoals] = React.useState(loadGoals);
  const [showForm, setShowForm] = React.useState(false);

  React.useEffect(() => {
    localStorage.setItem(GOALS_KEY, JSON.stringify(goals));
  }, [goals]);

  function toggleObjective(goalId, objId) {
    // localStorage-backed only: no supabase.update() here by design (see NOTE above).
    setGoals(gs => gs.map(g => g.id !== goalId ? g : {
      ...g, objectives: g.objectives.map(o => o.id !== objId ? o : {...o, done: !o.done}),
    }));
  }

  function addGeneratedObjectives(goalId, texts) {
    // Appends locally-generated mini-objectives (see generateObjectives() above).
    // Same localStorage-only persistence path as every other goals mutation here.
    setGoals(gs => gs.map(g => g.id !== goalId ? g : {
      ...g,
      objectives: [...g.objectives, ...texts.map(text => ({
        id: 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        text, done: false,
      }))],
    }));
  }

  function addGoal(g) {
    setGoals(gs => [g, ...gs]);
    setShowForm(false);
  }

  return h('div', {id:'goals'},
    goals.length ? h('div', {className:'summary'},
      h('span', null, h('b', null, goals.length), ' goals'),
      h('span', null, h('b', null, goals.reduce((n,g)=>n+g.objectives.filter(o=>o.done).length,0)), ' objectives done')) : null,
    showForm
      ? h(NewGoalForm, {onAdd:addGoal, onCancel:()=>setShowForm(false)})
      : h('button', {type:'button', className:'newgoalbtn', onClick:()=>setShowForm(true)}, '+ New goal'),
    goals.length === 0 && !showForm
      ? h('p', {className:'muted', style:{padding:'16px 2px'}}, 'No goals yet - add your first.')
      : null,
    goals.length ? h('div', {className:'goal-path', style:{marginTop:'10px'}},
      goals.map((g, i) => h('div', {className:'goal-row', key:g.id},
        h('div', {className:'goal-connector'},
          h('span', {className:'goal-node-dot', style:{color: GOAL_STATUS_COLOR[g.status]}}),
          i < goals.length - 1 ? h('span', {className:'goal-node-line'}) : null),
        h(GoalBox, {g, onToggle: toggleObjective, onGenerate: addGeneratedObjectives})))) : null);
}

function App() {
  const [session, setSession] = React.useState(undefined);
  React.useEffect(() => {
    supabase.auth.getSession().then(r => setSession(r.data.session));
    const sub = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return h('p', {className:'muted', style:{padding:'16px'}}, 'Loading...');
  return session ? h(Chat, {session}) : h(Auth);
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
