<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alleah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f1115;color:#e6e6e6;font:16px/1.5 -apple-system,system-ui,sans-serif}
#root{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
h1{font-size:18px;margin:0}
#thread{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}

button{background:#3ecf8e;color:#08130d;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}

</style></head><body>
<div id="root"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import React from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
const h = React.createElement;
const SB_URL = "https://sphnmcjlxxzgovisgepo.supabase.co";
const supabase = createClient(SB_URL, "sb_publishable_vVfIttSbf_XLWKl2xahBWA_-sXU34L0");
const HISTORY_KEY = "alleah_chat_v1";

function Auth() {
  const [email, setEmail] = React.useState('');
  const [pw, setPw] = React.useState('');
  const [msg, setMsg] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  async function go(mode) {
    setBusy(true); setMsg('');
    const res = mode === 'up'
      ? await supabase.auth.signUp({email, password: pw})
      : await supabase.auth.signInWithPassword({email, password: pw});
    setBusy(false);
    if (res.error) setMsg(res.error.message);
    else if (mode === 'up' && !res.data.session) setMsg('Check your email to confirm, then sign in.');
  }
  return h('div', {className:'auth'},
    h('h1', null, 'Alleah'),
    h('div', {style:{height:'12px'}}),
    h('input', {placeholder:'email', type:'email', value:email, onChange:e=>setEmail(e.target.value)}),
    h('div', {style:{height:'8px'}}),
    h('input', {placeholder:'password', type:'password', value:pw, onChange:e=>setPw(e.target.value)}),
    h('div', {className:'row'},
      h('button', {disabled:busy, onClick:()=>go('in')}, 'Sign in'),
      h('button', {className:'secondary', disabled:busy, onClick:()=>go('up')}, 'Sign up')),
    msg ? h('p', {className:'muted'}, msg) : null);
}

function Chat(props) {
  const [messages, setMessages] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
  });
  const [text, setText] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState('');
  const [view, setView] = React.useState('chat');
  const endRef = React.useRef(null);
  React.useEffect(() => {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-60)));
    endRef.current && endRef.current.scrollIntoView({behavior:'smooth'});
  }, [messages, busy]);

  async function send() {
    const content = text.trim();
    if (!content || busy) return;
    setErr(''); setText('');
    const next = [...messages, {role:'user', content}];
    setMessages(next); setBusy(true);
    try {
      const res = await fetch(SB_URL + '/functions/v1/ask', {
        method:'POST',
        headers:{'content-type':'application/json','authorization':'Bearer ' + props.session.access_token},
        body: JSON.stringify({messages: next.slice(-10).map(m => ({role: m.role, content: m.content}))})
      });
      const out = await res.json();
      if (out.error) setErr('Error: ' + out.error);
      else setMessages(m => [...m, {role:'assistant', content: out.answer, folders: out.folders || []}]);
    } catch (e) { setErr('Error: ' + e); }
    setBusy(false);
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return h(React.Fragment, null,
    h('header', null,
      h('h1', null, 'Alleah'),
      h('div', {className:'navbar'},
        h('button', {className:'secondary', style:{marginTop:0, background: view==='chat' ? '#3ecf8e':'#2c313a', color: view==='chat' ? '#08130d':'#e6e6e6'}, onClick:()=>setView('chat')}, 'Chat'),
        h('button', {className:'secondary', style:{marginTop:0, background: view==='tasks' ? '#3ecf8e':'#2c313a', color: view==='tasks' ? '#08130d':'#e6e6e6'}, onClick:()=>setView('tasks')}, 'Tasks'),
        h('button', {className:'secondary', style:{marginTop:0, background: view==='goals' ? '#3ecf8e':'#2c313a', color: view==='goals' ? '#08130d':'#e6e6e6'}, onClick:()=>setView('goals')}, 'Goals'),
        h('button', {className:'secondary', onClick:()=>{ if(confirm('Clear this conversation? (Your memory folders are not affected.)')) setMessages([]); }}, 'New chat'),
        h('button', {className:'secondary', onClick:()=>supabase.auth.signOut()}, 'Sign out'))),
    view === 'tasks' ? h(Tasks, {session: props.session})
    : view === 'goals' ? h(Goals, {session: props.session})
    : h(React.Fragment, null,
    h('div', {id:'thread'},
      messages.length === 0 ? h('p', {className:'muted', style:{padding:'0 6px'}}, 'Talk to me. What you tell me about what you know gets remembered - automatically.') : null,
      messages.map((m, i) => h(React.Fragment, {key:i},
        h('div', {className:'msg ' + m.role}, m.content),
        m.folders && m.folders.length
          ? h('div', {className:'cites'}, 'memory: ' + m.folders.map(f => '[' + f.n + '] ' + f.title).join('  '))
          : null)),
      busy ? h('div', {className:'typing'}, 'thinking...') : null,
      h('div', {ref:endRef})),
    err ? h('p', {className:'err'}, err) : null,
    h('div', {className:'composer'},
      h('textarea', {placeholder:'Message Alleah...', value:text, rows:1, onChange:e=>setText(e.target.value), onKeyDown:onKey}),
      h('button', {disabled:busy || !text.trim(), onClick:send}, 'Send'))));
}

// ===== Task tray =====
// Three meters visualize BUDGET CONSUMED (steps / spend / time) - deliberately no
// percent-complete bar anywhere: completion isn't knowable.
const STATUS_COLOR = {queued:'#9aa3ad', running:'#3ecf8e', done:'#3ecf8e', capped:'#e0a458', failed:'#ff7b72', cancelled:'#5c636e'};

function fmtAge(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

function TaskCard(props) {
  const t = props.t;
  const [open, setOpen] = React.useState(false);
  const active = t.status === 'queued' || t.status === 'running';
  // Kind-aware budget caps: build/revision run on the larger build budget.
  const CAP = (t.kind === 'build' || t.kind === 'revision')
    ? {steps: 50, spend: 2.00, min: 30}
    : {steps: 25, spend: 0.50, min: 15};
  const steps = Math.min(t.steps_used || 0, CAP.steps);
  const spend = Math.min(Number(t.spend_usd) || 0, CAP.spend);
  const spendRatio = spend / CAP.spend;
  const endMs = t.completed_at ? new Date(t.completed_at).getTime() : Date.now();
  const elapsedMs = Math.max(0, Math.min(endMs - new Date(t.created_at).getTime(), CAP.min*60000));
  const elapsed = Math.floor(elapsedMs/60000) + 'm ' + Math.floor((elapsedMs%60000)/1000) + 's';
  const spendColor = spendRatio < 0.5 ? '#3ecf8e' : spendRatio < 0.8 ? '#e0a458' : '#ff7b72';
  const color = STATUS_COLOR[t.status] || '#9aa3ad';
  const pv = props.preview;
  const rvw = props.review;
  const sha = rvw ? (/audited staged commit: ([0-9a-f]{7,40})/i.exec(rvw) || [])[1] : null;
  // Clean verdict needs POSITIVE evidence: an audited SHA plus an explicit no-findings
  // marker, and no findings SECTION. A findings section is an anchored "Findings:" line
  // not immediately saying none/0 - so "no findings in the CSS" elsewhere can't cancel
  // a real findings list. Ambiguity defaults to "ask Alleah" - never green.
  const saysClean = rvw ? /\bno findings\b|\b0 findings\b|\bverdict:\s*clean\b|\bfindings:\s*(none|0)\b/i.test(rvw) : false;
  const hasFindings = rvw ? /^\s*findings\s*:(?!\s*(none|0)\b)/mi.test(rvw) : false;
  const clean = !!sha && saysClean && !hasFindings;
  const safeUrl = pv && typeof pv.preview_url === 'string' && /^https:\/\//.test(pv.preview_url);
  return h('div', {className:'card'},
    h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px'}},
      h('span', {className:'badge'},
        h('span', {className:'dot' + (t.status==='running'?' pulse':''), style:{background:color}}),
        h('span', {style:{color:color}}, (t.kind && t.kind !== 'research' ? t.kind + ' · ' : '') + t.status)),
      h('span', {className:'small'}, fmtAge(t.created_at)),
      active ? h('button', {className:'secondary', style:{marginTop:0,padding:'4px 10px',fontSize:'12px'},
        onClick:function(){ if(confirm('Cancel this task?')) props.onCancel(t.id); }}, 'Cancel') : null),
    pv && !(pv.status === 'expired' && !safeUrl) ? h('p', {className:'small', style:{margin:'6px 0 0'}},
      safeUrl ? h('a', {href: pv.preview_url, target:'_blank', rel:'noopener', style:{color:'#3ecf8e'}}, 'Preview ↗')
              : h('span', {style:{color:'#9aa3ad'}}, pv.status === 'building' ? 'preview building…' : 'preview url missing'),
      '  rev ' + pv.revision + ' · ' + pv.status,
      rvw ? (clean
        ? h('span', null, '  ·  review: clean ✓  ',
            h('a', {href:'https://github.com/maxrym-svg/alleah/actions/workflows/promote-preview.yml', target:'_blank', rel:'noopener', style:{color:'#3ecf8e'}}, 'Promote ↗'),
            '  sha ' + sha.slice(0,12) + '…')
        : hasFindings
          ? h('span', {style:{color:'#e0a458'}}, '  ·  review: findings - ask Alleah')
          : h('span', {style:{color:'#9aa3ad'}}, '  ·  review done - ask Alleah for the verdict')) : null) : null,
    h('p', {style:{margin:'8px 0 4px',cursor:'pointer'}, onClick:function(){setOpen(!open)}},
      (function(){
        const label = t.kind === 'review'
          ? 'audit of build ' + (t.instruction || '').trim().slice(0, 8)
          : (t.instruction || '');
        return open ? label : (label.length > 110 ? label.slice(0,110) + '...' : label);
      })()),
    t.status === 'running' && t.progress ? h('p', {className:'small', style:{color:'#e6e6e6'}}, '▸ ' + t.progress) : null,
    active ? h('div', null,
      h('div', {className:'small'}, 'steps used: ' + steps + ' / ' + CAP.steps),
      h('div', {className:'segbar'}, Array.from({length: CAP.steps}, function(_, i){
        return h('span', {key:i, className:'seg' + (i < steps ? ' on' : '')}); })),
      h('div', {className:'small'}, 'spend: $' + spend.toFixed(2) + ' / $' + CAP.spend.toFixed(2) + ' cap'),
      h('div', {className:'meter'}, h('div', {style:{width:(spendRatio*100)+'%',background:spendColor}})),
      h('div', {className:'small'}, 'time since queued: ' + elapsed + ' / ' + CAP.min + 'm limit (worker may start up to 1m after queuing)'),
      h('div', {className:'meter'}, h('div', {style:{width:(elapsedMs/(CAP.min*60000)*100)+'%',background:'#3ecf8e'}}))) : null,
    open ? h('div', null,
      t.result ? h('div', {className:'task-full'}, t.result) : null,
      t.error ? h('p', {className:'err', style:{padding:0}}, t.error) : null,
      h('p', {className:'small'}, 'steps ' + (t.steps_used ?? 0) + ' · $' + (Number(t.spend_usd)||0).toFixed(2) +
        ' · queued ' + new Date(t.created_at).toLocaleString() +
        (t.completed_at ? ' · finished ' + new Date(t.completed_at).toLocaleString() : ''))) : null);
}

function Tasks(props) {
  const [tasks, setTasks] = React.useState([]);
  const [previews, setPreviews] = React.useState({});
  const [reviews, setReviews] = React.useState({});
  const [msg, setMsg] = React.useState('loading...');
  async function load() {
    const r = await supabase.from('worker_tasks').select('*').order('created_at', {ascending:false}).limit(50);
    if (r.error) { setMsg('Error: ' + r.error.message); return; }
    setTasks(r.data);
    setMsg(r.data.length ? '' : 'No tasks yet. Say "Alleah, start a task" in chat.');
    // latest done review per build task (review instruction = build task id)
    const rv = {};
    r.data.filter(function(t){ return t.kind === 'review' && t.status === 'done' && t.result; })
      .forEach(function(t){ const key = (t.instruction || '').trim(); if (!rv[key]) rv[key] = t.result; });
    setReviews(rv);
    const p = await supabase.from('preview_tasks').select('task_id,status,revision,preview_url');
    if (!p.error) {
      const map = {};
      p.data.forEach(function(x){ map[x.task_id] = x; });
      setPreviews(map);
    }
  }
  React.useEffect(function(){
    load(); // initial load always runs; only the polls are visibility-gated
    const iv = setInterval(function(){ if (document.visibilityState === 'visible') load(); }, 5000);
    return function(){ clearInterval(iv); };
  }, []);
  async function cancel(id) {
    // Guarded: can never clobber a terminal status that landed after render
    await supabase.from('worker_tasks').update({status:'cancelled'}).eq('id', id).in('status', ['queued','running']);
    load();
  }
  return h('div', {id:'tasks'},
    msg ? h('p', {className:'muted'}, msg) : null,
    tasks.map(function(t){ return h(TaskCard, {key:t.id, t:t, onCancel:cancel, preview:previews[t.id], review:reviews[String(t.id)]}); }));
}

// ===== Goals tab =====
// NOTE (data layer, per revision 2a9e67c9): goal + difficulty data is served from an
// in-memory fixture below, not from the database. The earlier version of this feature
// staged two migrations (006_goals.sql, 007_goal_difficulty.sql) that created a real
// `goals` table; those are removed. When a real goals table + RPCs are designed and
// migrated, swap GOAL_FIXTURES / the local mutations below for supabase.from('goals')
// calls following the same RLS-policy pattern as folders/queries/worker_tasks. Until
// then this view has no schema dependency and performs no live DB writes.
const DIFFICULTY = {
  easy:   {label: 'Easy',   color: '#3ecf8e'},
  medium: {label: 'Medium', color: '#58a6ff'},
  hard:   {label: 'Hard',   color: '#e0a458'},
  epic:   {label: 'Epic',   color: '#d68fff'},
};
const GOAL_STATUS_COLOR = {active:'#3ecf8e', completed:'#3ecf8e', paused:'#e0a458', abandoned:'#5c636e'};
const GOALS_DAY = 86400000;

    {

      description: 'Got to 20k words then priorities shifted. Keeping the notes in case this comes back around.',

function fmtRelDay(ms) {
  const now = Date.now();
  const days = Math.round((ms - now) / GOALS_DAY);
  if (days === 0) return 'today';
  if (days > 0) return 'in ' + days + 'd';
  return Math.abs(days) + 'd ago';
}
function fmtAgeShort(ms) {
  const days = Math.round((Date.now() - ms) / GOALS_DAY);
  if (days < 1) return 'today';
  if (days < 30) return days + 'd ago';
  if (days < 365) return Math.round(days/30) + 'mo ago';
  return Math.round(days/365) + 'y ago';
}

function GoalCard(props) {
  const g = props.g;
  const [open, setOpen] = React.useState(false);
  const diff = DIFFICULTY[g.difficulty];
  const color = GOAL_STATUS_COLOR[g.status];
  const overdue = g.status === 'active' && g.target_date < Date.now();
  const meterColor = overdue ? '#ff7b72' : color;
  let dateLine;
  if (g.status === 'completed') dateLine = 'completed ' + fmtAgeShort(g.completed_at);
  else if (g.status === 'active') dateLine = (overdue ? 'was due ' : 'due ') + fmtRelDay(g.target_date);
  else dateLine = 'target ' + fmtRelDay(g.target_date);
  return h('div', {className:'card', style:{cursor:'pointer'}, onClick:()=>setOpen(!open)},
    h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'8px'}},
      h('p', {style:{fontSize:'15px',fontWeight:700,margin:'0 0 2px'}}, g.title),
      h('span', {className:'pill', style:{background:diff.color+'22', color:diff.color, border:'1px solid '+diff.color+'55'}}, diff.label)),
    h('div', {style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}},
      h('span', {className:'badge'},
        h('span', {className:'dot' + (g.status==='active'?' pulse':''), style:{background:color}}),
        h('span', {style:{color:color}}, g.status)),
      h('span', {className:'small'}, g.category),
      h('span', {className:'small'}, '·'),
      h('span', {className:'small', style:{color: overdue ? '#ff7b72' : '#9aa3ad'}}, dateLine)),
    h('div', {className:'meter'}, h('div', {style:{width:g.progress_pct+'%', background:meterColor}})),
    h('div', {className:'small'}, g.progress_pct + '% complete' + (g.streak_days ? '  ·  🔥 ' + g.streak_days + ' day streak' : '')),
    open ? h('div', {className:'goal-desc'}, g.description) : null);
}

function Goals(props) {
  const [goals, setGoals] = React.useState(makeGoalFixtures);
  const [filter, setFilter] = React.useState('all');
  const [showAdd, setShowAdd] = React.useState(false);
  const [form, setForm] = React.useState({title:'', category:'Health', difficulty:'medium', target:''});

  const counts = {active:0, completed:0, paused:0, abandoned:0};
  goals.forEach(g => { counts[g.status] = (counts[g.status]||0) + 1; });
  const list = goals.filter(g => filter === 'all' || g.status === filter);

  function addGoal() {
    const title = form.title.trim();
    if (!title) { alert('Give the goal a title.'); return; }
    const target_date = form.target ? new Date(form.target).getTime() : Date.now() + 30*GOALS_DAY;
    // In-memory only: no supabase.insert() here by design (see NOTE above).
    setGoals(gs => [{
      id: 'g' + (Date.now()), title, category: form.category, difficulty: form.difficulty,
      status: 'active', description: '(no description yet)', progress_pct: 0, streak_days: 0,
      created_at: Date.now(), target_date,
    }, ...gs]);
    setShowAdd(false);
    setForm({title:'', category:'Health', difficulty:'medium', target:''});
  }

  return h('div', {id:'goals'},
    h('div', {className:'summary'},
      h('span', null, h('b', null, counts.active||0), ' active'),
      h('span', null, h('b', null, counts.completed||0), ' completed'),
      h('span', null, h('b', null, counts.paused||0), ' paused'),
      h('span', null, h('b', null, counts.abandoned||0), ' abandoned')),
    h('div', {className:'filterbar'},
      [['all','All'],['active','Active'],['completed','Completed'],['paused','Paused'],['abandoned','Abandoned']].map(([k,label]) =>
        h('button', {key:k, className:'filterbtn' + (filter===k?' active':''), onClick:()=>setFilter(k)}, label))),
    showAdd ? h('div', {className:'card'},
      h('p', {style:{fontSize:'15px',fontWeight:700,margin:'0 0 8px'}}, 'New goal'),
      h('div', {className:'addform'},
        h('input', {placeholder:'Goal title', value:form.title, onChange:e=>setForm({...form, title:e.target.value})}),
        h('div', {className:'row2'},
          h('select', {value:form.category, onChange:e=>setForm({...form, category:e.target.value})},
            ['Health','Career','Learning','Creative','Finance'].map(c => h('option', {key:c}, c))),
          h('select', {value:form.difficulty, onChange:e=>setForm({...form, difficulty:e.target.value})},
            Object.keys(DIFFICULTY).map(k => h('option', {key:k, value:k}, DIFFICULTY[k].label)))),
        h('input', {type:'date', value:form.target, onChange:e=>setForm({...form, target:e.target.value})}),
        h('div', {className:'row2'},
          h('button', {className:'secondary', onClick:()=>setShowAdd(false)}, 'Cancel'),
          h('button', {onClick:addGoal}, 'Add goal'))))
    : h('button', {className:'secondary newgoalbtn', onClick:()=>setShowAdd(true)}, '+ New goal'),
    list.length ? list.map(g => h(GoalCard, {key:g.id, g})) : h('p', {className:'muted'}, 'No goals in this filter yet.'));
}

function App() {
  const [session, setSession] = React.useState(undefined);
  React.useEffect(() => {
    supabase.auth.getSession().then(r => setSession(r.data.session));
    const sub = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.data.subscription.unsubscribe();
  }, []);
  if (session === undefined) return h('p', {className:'muted', style:{padding:'16px'}}, 'Loading...');
  return session ? h(Chat, {session}) : h(Auth);
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
